x-app-env: &app-env
  API_KEY: ${API_KEY:-super-secret-api-key}
  DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  consumer:
    build: .
    command: faststream run app.consumer.main:app
    environment: *app-env
    depends_on:
      api:
        # API применяет миграции перед стартом
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  webhook-mock:
    build: .
    command: uvicorn webhook_mock.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  rabbitmq_data:
